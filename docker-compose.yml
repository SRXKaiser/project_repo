
services:
  db:
    image: postgres:18
    container_name: investigatec_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: investigatec_api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env.docker

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: "1"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - investigatec_storage:/app/storage

volumes:
  postgres_data:
  investigatec_storage:
